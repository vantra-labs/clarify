<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Unb;src:url(file:///mnt/user-data/uploads/VANTRA/projects/SmartPlanner/installer/clarify_installer/assets/fonts/Unbounded-Variable.ttf);font-weight:200 900}
@font-face{font-family:Golos;src:url(file:///mnt/user-data/uploads/VANTRA/projects/SmartPlanner/installer/clarify_installer/assets/fonts/GolosText-Variable.ttf);font-weight:400 900}
*{margin:0;box-sizing:border-box}
html,body{width:1320px;height:880px;overflow:hidden;background:#F4F0E9;font-family:Golos;color:#16140F}
.wrap{position:absolute;inset:0;padding:84px 80px}

.badges{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.b{font-size:28px;font-weight:500;display:flex;gap:14px;align-items:center}
.b i{width:30px;height:30px;border-radius:50%;background:#4F46E5;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:18px;font-weight:800}
.price{position:absolute;left:80px;bottom:70px;font-family:Unb;font-weight:700;font-size:44px}

.lap{position:absolute;right:-60px;top:150px;width:640px;border-radius:18px;background:#16140F;padding:14px 14px 18px;box-shadow:0 40px 80px rgba(22,20,15,.25)}
.lap img{width:100%;border-radius:8px;display:block}

.mark{position:absolute;border:4px solid #4F46E5;border-radius:12px}
.tag{position:absolute;background:#4F46E5;color:#fff;font-weight:700;font-size:20px;border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.big{position:absolute;right:70px;top:220px;width:520px}
.box{background:#fff;border-radius:22px;padding:30px 34px;box-shadow:0 20px 50px rgba(22,20,15,.12);font-size:30px;font-weight:600}
.arrow{font-family:Unb;font-size:60px;text-align:center;color:#4F46E5;margin:14px 0}
.muted{color:#8A8478;text-decoration:line-through;font-weight:500}
