<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Unbounded';src:local('Unbounded');font-weight:200 900}
@font-face{font-family:'Golos Text';src:local('Golos Text');font-weight:400 900}
*{margin:0;box-sizing:border-box}
html,body{width:1320px;height:880px;overflow:hidden;background:#F4F0E9;font-family:'Golos Text';color:#16140F}
.wrap{position:absolute;inset:0;padding:84px 80px}
.kicker{display:inline-block;font-size:24px;font-weight:600;letter-spacing:.5px;color:#fff;background:#16140F;padding:10px 20px;border-radius:999px}
h1{font-family:'Unbounded';font-weight:700;font-size:64px;line-height:1.06;margin-top:34px;width:620px;letter-spacing:-1px}
.badges{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.b{font-size:28px;font-weight:500;display:flex;gap:14px;align-items:center}
.b i{width:30px;height:30px;border-radius:50%;background:#4F46E5;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:18px;font-weight:800}
.price{position:absolute;left:80px;bottom:70px;font-family:'Unbounded';font-weight:700;font-size:44px}
.price span{font-family:'Golos Text';font-weight:500;font-size:26px;color:#6B665C;margin-right:10px}
.lap{position:absolute;right:-60px;top:150px;width:640px;border-radius:18px;background:#16140F;padding:14px 14px 18px;box-shadow:0 40px 80px rgba(22,20,15,.25)}
.lap img{width:100%;border-radius:8px;display:block}
.phone{position:absolute;right:420px;top:380px;width:190px;border-radius:30px;background:#16140F;padding:10px;box-shadow:0 30px 60px rgba(22,20,15,.3)}
.phone img{width:100%;border-radius:22px;display:block}
.pill{position:absolute;font-size:22px;font-weight:600;background:#fff;border-radius:14px;padding:12px 18px;box-shadow:0 12px 30px rgba(22,20,15,.15)}
.mark{position:absolute;border:4px solid #4F46E5;border-radius:12px}
.tag{position:absolute;background:#4F46E5;color:#fff;font-weight:700;font-size:20px;border-radius:999px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.big{position:absolute;right:70px;top:220px;width:520px}
.box{background:#fff;border-radius:22px;padding:30px 34px;box-shadow:0 20px 50px rgba(22,20,15,.12);font-size:30px;font-weight:600}
.arrow{font-family:'Unbounded';font-size:60px;text-align:center;color:#4F46E5;margin:14px 0}
.muted{color:#8A8478;text-decoration:line-through;font-weight:500}
.sheet{position:absolute;right:50px;top:300px;width:560px;background:#fff;border-radius:18px;box-shadow:0 30px 70px rgba(22,20,15,.18);overflow:hidden;font-size:22px}
.sheet .bar{background:#E9F5EE;padding:14px 18px;font-family:monospace;font-size:18px;color:#1D6F42}
.sheet table{border-collapse:collapse;width:100%}.sheet td{border:1px solid #E4E0D8;padding:12px 14px}
.sheet tr:first-child td{background:#1D6F42;color:#fff;font-weight:700}.sheet tr:last-child td{font-weight:700;background:#F4F0E9}
.muted2{color:#8A8478;font-size:22px;font-weight:500}
</style></head><body><div class="wrap" id="w"></div>
